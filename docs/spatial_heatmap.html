<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Isometric Warehouse – Forklift A* Pathfinding + Tooltip</title>
<style>
    body {
        background: #111827;
        color: #e5e7eb;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }

    .warehouse-wrapper {
        perspective: 1600px;
    }

    .warehouse {
        width: 1200px;
        height: 900px;
        transform: rotateX(60deg) rotateZ(-45deg);
        transform-style: preserve-3d;
        display: grid;
        grid-template-columns: repeat(40, 1fr);
        grid-auto-rows: 1fr;
        gap: 2px;
    }

    .cell {
        position: relative;
        width: 100%;
        padding-top: 100%;
        border-radius: 1px;
        box-shadow: 0 0 0 1px #0f172a;
        transition: transform 0.15s ease, background 0.15s ease;
        cursor: pointer;
    }

    .cell:hover {
        transform: translateZ(8px);
    }

    .aisle { background: #4ade80; }

    .level-0 { background: #1e293b; }
    .level-1 { background: #22c55e; }
    .level-2 { background: #eab308; }
    .level-3 { background: #f97316; }
    .level-4 { background: #ef4444; }

    .path { background: #38bdf8 !important; }
    .start { background: #22c55e !important; box-shadow: 0 0 0 2px #16a34a; }
    .end { background: #f97316 !important; box-shadow: 0 0 0 2px #ea580c; }

    /* Tooltip */
    #tooltip {
        position: fixed;
        background: rgba(0,0,0,0.85);
        color: #fff;
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 12px;
        pointer-events: none;
        z-index: 9999;
        display: none;
        white-space: nowrap;
    }
</style>
</head>
<body>

<div class="warehouse-wrapper">
    <div class="warehouse" id="warehouse-grid"></div>
</div>

<div id="tooltip"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(function () {

    const rows = 30;
    const cols = 40;

    const aisleEveryX = 6;
    const crossEveryY = 5;

    const $grid = $('#warehouse-grid');
    const $tooltip = $('#tooltip');

    const grid = [];

    // Build grid
    for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) {

            const isAisle = (c % aisleEveryX === 0) || (r % crossEveryY === 0);

            const $cell = $('<div>')
                .addClass('cell')
                .attr('data-row', r)
                .attr('data-col', c);

            if (isAisle) {
                $cell.addClass('aisle');
                $cell.attr('data-type', 'Aisle');
                $cell.attr('data-level', '-');
            } else {
                const dist = Math.abs(r - rows/2) + Math.abs(c - cols/2);
                let level = 4 - Math.min(4, Math.floor(dist / 4));
                if (level < 0) level = 0;

                $cell.addClass(`level-${level}`);
                $cell.attr('data-type', 'Rack');
                $cell.attr('data-level', level);
            }

            grid[r][c] = {
                walkable: isAisle,
                $el: $cell
            };

            // Tooltip events
            $cell.on('mouseenter', function () {
                const type = $(this).data('type');
                const row = $(this).data('row');
                const col = $(this).data('col');
                const level = $(this).data('level');

                $tooltip.html(
                    `<strong>${type}</strong><br>
                     Row: ${row}<br>
                     Col: ${col}<br>
                     Level: ${level}`
                );
                $tooltip.show();
            });

            $cell.on('mousemove', function (e) {
                $tooltip.css({
                    top: e.clientY + 15 + 'px',
                    left: e.clientX + 15 + 'px'
                });
            });

            $cell.on('mouseleave', function () {
                $tooltip.hide();
            });

            $grid.append($cell);
        }
    }

    // ---------- A* PATHFINDING ----------

    function heuristic(a, b) {
        return Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
    }

    function neighbors(n) {
        const dirs = [
            {dr: -1, dc: 0},
            {dr: 1, dc: 0},
            {dr: 0, dc: -1},
            {dr: 0, dc: 1}
        ];
        const out = [];
        for (const d of dirs) {
            const nr = n.r + d.dr;
            const nc = n.c + d.dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                if (grid[nr][nc].walkable) out.push({r: nr, c: nc});
            }
        }
        return out;
    }

    function key(n) { return `${n.r},${n.c}` }

    function aStar(start, end) {
        const open = [start];
        const came = {};
        const g = {};
        const f = {};

        g[key(start)] = 0;
        f[key(start)] = heuristic(start, end);

        while (open.length) {
            let current = open[0];
            let idx = 0;

            for (let i = 1; i < open.length; i++) {
                if ((f[key(open[i])] ?? Infinity) < (f[key(current)] ?? Infinity)) {
                    current = open[i];
                    idx = i;
                }
            }

            if (current.r === end.r && current.c === end.c) {
                const path = [];
                let ck = key(current);
                while (came[ck]) {
                    const [rr, cc] = ck.split(',').map(Number);
                    path.push({r: rr, c: cc});
                    ck = came[ck];
                }
                path.push(start);
                return path.reverse();
            }

            open.splice(idx, 1);

            for (const nb of neighbors(current)) {
                const tentative = (g[key(current)] ?? Infinity) + 1;
                if (tentative < (g[key(nb)] ?? Infinity)) {
                    came[key(nb)] = key(current);
                    g[key(nb)] = tentative;
                    f[key(nb)] = tentative + heuristic(nb, end);
                    if (!open.some(n => n.r === nb.r && n.c === nb.c)) {
                        open.push(nb);
                    }
                }
            }
        }

        return null;
    }

    // ---------- CLICK INTERACTION ----------

    let start = null;
    let end = null;

    function clearPath() {
        $('.path').removeClass('path');
        $('.start').removeClass('start');
        $('.end').removeClass('end');
    }

    $('.cell').on('click', function () {
        const r = parseInt($(this).data('row'));
        const c = parseInt($(this).data('col'));

        if (!grid[r][c].walkable) return;

        if (!start) {
            clearPath();
            start = {r, c};
            end = null;
            grid[r][c].$el.addClass('start');
            return;
        }

        if (!end) {
            end = {r, c};
            grid[r][c].$el.addClass('end');

            const path = aStar(start, end);
            if (path) {
                for (const p of path) {
                    if (!(p.r === start.r && p.c === start.c) &&
                        !(p.r === end.r && p.c === end.c)) {
                        grid[p.r][p.c].$el.addClass('path');
                    }
                }
            }
            return;
        }

        clearPath();
        start = {r, c};
        end = null;
        grid[r][c].$el.addClass('start');
    });

});
</script>

</body>
</html>
