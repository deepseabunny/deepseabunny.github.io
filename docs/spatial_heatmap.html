<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dense Warehouse Heatmap</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css">

<style>
    body {
        margin: 0;
        background: #111;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #heatmap {
        display: grid;
        width: 100vw;
        height: 100vh;
    }

    .cell {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
    }

    .cell:hover {
        outline: 1px solid white;
        z-index: 10;
    }
</style>
</head>
<body>

<div id="heatmap"></div>

<script>
$(function () {

    const rows = 60;     // dense grid
    const cols = 60;
    const $map = $("#heatmap");

    // Set CSS grid dynamically
    $map.css({
        "grid-template-columns": `repeat(${cols}, 1fr)`,
        "grid-template-rows": `repeat(${rows}, 1fr)`
    });

    // Generate random heat values 0–1
    function randomHeat() {
        return Math.random();
    }

    // Convert heat value → color (cool → warm)
    function heatToColor(v) {
        // v = 0 → blue, v = 1 → red
        const r = Math.floor(255 * v);
        const g = Math.floor(80 * (1 - v));
        const b = Math.floor(255 * (1 - v));
        return `rgb(${r},${g},${b})`;
    }

    // Build grid
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {

            const heat = randomHeat();
            const color = heatToColor(heat);

            const $cell = $("<div>")
                .addClass("cell")
                .css("background", color)
                .attr("title", `(${x}, ${y}) heat=${heat.toFixed(2)}`);

            $map.append($cell);
        }
    }

    // jQuery UI tooltip
    $(document).tooltip({ track: true });

});
</script>

</body>
</html>
