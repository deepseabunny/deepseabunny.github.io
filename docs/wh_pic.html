<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Warehouse Pick Path Simulator</title>
<style>
/* ————————————————————————————————————————————————
   THEME + BASE
———————————————————————————————————————————————— */
:root {
  --bg: #05060a;
  --panel: #10131c;
  --accent: #4ade80;
  --accent-soft: rgba(74, 222, 128, 0.12);
  --accent-strong: rgba(74, 222, 128, 0.35);
  --text-main: #e5e7eb;
  --text-soft: #9ca3af;
  --border-subtle: #1f2933;
  --danger: #f97373;
  --danger-soft: rgba(248, 113, 113, 0.12);
  --grid-line: #111827;
  --badge-bg: #111827;
  --badge-border: #1f2937;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.55);
  --shadow-subtle: 0 0 0 1px rgba(15, 23, 42, 0.9);
  --font-mono: system-ui, -apple-system, BlinkMacSystemFont, "SF Mono",
    "Menlo", "Consolas", monospace;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #020617 0, #020617 40%, #000 100%);
  color: var(--text-main);
  font-family: var(--font-mono);
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 24px;
}

/* ————————————————————————————————————————————————
   APP SHELL
———————————————————————————————————————————————— */
.app-shell {
  width: 100%;
  max-width: 1200px;
  background: #020617;
  border-radius: 18px;
  box-shadow: var(--shadow-soft), var(--shadow-subtle);
  border: 1px solid rgba(15, 23, 42, 0.9);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.app-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.app-title-main {
  font-size: 15px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.app-title-sub {
  font-size: 11px;
  color: var(--text-soft);
}

.badge {
  font-size: 10px;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid var(--badge-border);
  background: var(--badge-bg);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.18);
}

.badge-danger {
  color: #fca5a5;
}

/* ————————————————————————————————————————————————
   MAIN LAYOUT
———————————————————————————————————————————————— */
.app-main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 520px;
}

.panel {
  padding: 16px 18px;
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel:last-child {
  border-right: none;
  border-left: 1px solid var(--border-subtle);
}

/* ————————————————————————————————————————————————
   BUTTONS
———————————————————————————————————————————————— */
.btn {
  border-radius: 999px;
  border: 1px solid #1f2937;
  background: #111827;
  color: var(--text-main);
  font-size: 11px;
  padding: 6px 10px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.btn-primary {
  border-color: rgba(74, 222, 128, 0.6);
  background: #064e3b;
  color: #bbf7d0;
  box-shadow: 0 0 0 1px rgba(22, 163, 74, 0.5),
    0 0 18px rgba(22, 163, 74, 0.35);
}

/* ————————————————————————————————————————————————
   PICK LIST
———————————————————————————————————————————————— */
.list {
  flex: 1;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  background: #020617;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: hidden;
}

.list-header {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr 0.8fr 0.6fr 0.6fr;
  gap: 6px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: #6b7280;
  padding-bottom: 6px;
  border-bottom: 1px solid #111827;
}

.item-row {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr 0.8fr 0.6fr 0.6fr;
  gap: 6px;
  font-size: 11px;
  padding: 6px 4px;
  border-radius: 8px;
  cursor: pointer;
}

.item-row:nth-child(odd) {
  background: rgba(15, 23, 42, 0.7);
}

.item-row:nth-child(even) {
  background: rgba(15, 23, 42, 0.4);
}

.item-row.active {
  border: 1px solid rgba(74, 222, 128, 0.7);
  background: rgba(22, 163, 74, 0.15);
}

/* ————————————————————————————————————————————————
   MAP
———————————————————————————————————————————————— */
.map-shell {
  flex: 1;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  background: #020617;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.map-grid {
  flex: 1;
  border-radius: 12px;
  border: 1px solid #111827;
  position: relative;
  overflow: hidden;
  padding: 10px;
}

.map-grid-inner {
  position: absolute;
  inset: 10px;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(5, 1fr);
  gap: 4px;
}

.cell {
  border-radius: 6px;
  border: 1px solid #020617;
  background: #020617;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: #4b5563;
}

.cell-pick {
  background: rgba(34, 197, 94, 0.18);
  border-color: rgba(34, 197, 94, 0.7);
}

.cell-current {
  background: rgba(34, 197, 94, 0.35);
  border-color: rgba(34, 197, 94, 1);
  box-shadow: 0 0 18px rgba(22, 163, 74, 0.7);
}

.cell-start {
  border-color: #4b5563;
  background: #0f172a;
}

.cell-label {
  position: absolute;
  bottom: 3px;
  right: 4px;
  font-size: 8px;
}

.cell-tag {
  position: absolute;
  top: 3px;
  left: 4px;
  font-size: 8px;
  padding: 2px 4px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(31, 41, 55, 0.9);
  color: #9ca3af;
}

.cell-tag-current {
  border-color: rgba(74, 222, 128, 0.9);
  color: #bbf7d0;
}

/* ————————————————————————————————————————————————
   FOOTER
———————————————————————————————————————————————— */
.footer {
  padding: 8px 18px;
  border-top: 1px solid var(--border-subtle);
  font-size: 10px;
  color: #6b7280;
  display: flex;
  justify-content: space-between;
}
</style>
</head>

<body>
<div class="app-shell">
<header class="app-header">
  <div>
    <div class="app-title-main">WAREHOUSE PICK PATH SIM</div>
    <div class="app-title-sub">Aisle-first routing · Sample item locations</div>
  </div>
  <div class="badge"><span class="badge-dot"></span>LIVE</div>
</header>

<main class="app-main">
  <!-- LEFT PANEL -->
  <section class="panel">
    <div class="controls-row">
      <button class="btn btn-primary" id="btn-generate">Generate Route</button>
      <button class="btn" id="btn-randomize">Randomize</button>
    </div>

    <div class="list">
      <div class="list-header">
        <div>Item</div><div>Loc</div><div>Zone</div><div>Lvl</div><div>Step</div>
      </div>
      <div class="list-body" id="pick-list"></div>
    </div>
  </section>

  <!-- RIGHT PANEL -->
  <section class="panel">
    <div class="map-shell">
      <div class="map-grid">
        <div class="map-grid-inner" id="map-grid"></div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <span>Start at staging (A1‑B1)</span>
  <span>Single‑file offline mode</span>
</footer>
</div>

<script>
/* ————————————————————————————————————————————————
   DATA + HELPERS
———————————————————————————————————————————————— */
const GRID_COLS = 8;
const GRID_ROWS = 5;

const baseItems = [
  { code:"SKU-1001", desc:"Small hardware bin", zone:"A", aisle:1, bay:2, level:1 },
  { code:"SKU-2044", desc:"Medium carton", zone:"A", aisle:1, bay:4, level:2 },
  { code:"SKU-3110", desc:"Bulk box", zone:"B", aisle:2, bay:1, level:1 },
  { code:"SKU-4520", desc:"Long item tube", zone:"B", aisle:3, bay:3, level:2 },
  { code:"SKU-5099", desc:"Pallet goods", zone:"C", aisle:4, bay:2, level:1 },
  { code:"SKU-6123", desc:"Fragile carton", zone:"C", aisle:5, bay:4, level:3 },
  { code:"SKU-7201", desc:"Oversized crate", zone:"D", aisle:6, bay:3, level:2 },
  { code:"SKU-8300", desc:"Small parts tote", zone:"D", aisle:7, bay:1, level:1 },
];

let items = [];
let route = [];
let currentStepIndex = 0;

const rand = (min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const clone = obj => JSON.parse(JSON.stringify(obj));

function locToGrid(aisle,bay){
  return { x: aisle-1, y: bay-1 };
}

function manhattan(a,b){
  return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
}

/* ————————————————————————————————————————————————
   ROUTE GENERATION
———————————————————————————————————————————————— */
function generateRoute(){
  const sorted = clone(items).sort((a,b)=>{
    if(a.aisle!==b.aisle) return a.aisle-b.aisle;
    if(a.bay!==b.bay) return a.bay-b.bay;
    return a.level-b.level;
  });

  const staging = {x:0,y:0};
  let last = staging;
  route = sorted.map((item,i)=>{
    const grid = locToGrid(item.aisle,item.bay);
    const dist = manhattan(last,grid);
    last = grid;
    return { ...item, step:i+1, grid, distanceFromPrev:dist };
  });

  currentStepIndex = 0;
  renderPickList();
  renderMap();
}

/* ————————————————————————————————————————————————
   RANDOMIZATION
———————————————————————————————————————————————— */
function randomizeLocations(){
  items = clone(baseItems).map(item=>{
    return {
      ...item,
      aisle: Math.min(Math.max(item.aisle + rand(-1,1),1),GRID_COLS),
      bay:   Math.min(Math.max(item.bay   + rand(-1,1),1),GRID_ROWS),
      level: Math.min(Math.max(item.level + rand(-1,1),1),3),
    };
  });
  generateRoute();
}

/* ————————————————————————————————————————————————
   RENDER: PICK LIST
———————————————————————————————————————————————— */
function renderPickList(){
  const container = document.getElementById("pick-list");
  container.innerHTML = "";

  route.forEach((item,idx)=>{
    const row = document.createElement("div");
    row.className = "item-row";
    if(idx===currentStepIndex) row.classList.add("active");

    row.innerHTML = `
      <div>${item.code}</div>
      <div>A${item.aisle}-B${item.bay}</div>
      <div>${item.zone}</div>
      <div>L${item.level}</div>
      <div>${item.step}</div>
    `;

    row.onclick = ()=>{
      currentStepIndex = idx;
      renderPickList();
      renderMap();
    };

    container.appendChild(row);
  });
}

/* ————————————————————————————————————————————————
   RENDER: MAP
———————————————————————————————————————————————— */
function renderMap(){
  const grid = document.getElementById("map-grid");
  grid.innerHTML = "";

  const pickMap = {};
  route.forEach((item,idx)=>{
    const key = `${item.grid.x},${item.grid.y}`;
    pickMap[key] = pickMap[key] || [];
    pickMap[key].push({item,idx});
  });

  const current = route[currentStepIndex]?.grid || {x:-1,y:-1};

  for(let y=0;y<GRID_ROWS;y++){
    for(let x=0;x<GRID_COLS;x++){
      const cell = document.createElement("div");
      cell.className = "cell";

      const key = `${x},${y}`;
      const picks = pickMap[key] || [];
      const isStart = x===0 && y===0;
      const isPick = picks.length>0;
      const isCurrent = current.x===x && current.y===y;

      if(isStart) cell.classList.add("cell-start");
      if(isPick) cell.classList.add("cell-pick");
      if(isCurrent) cell.classList.add("cell-current");

      const label = document.createElement("div");
      label.className = "cell-label";
      label.textContent = `A${x+1}-B${y+1}`;
      cell.appendChild(label);

      if(isPick){
        const tag = document.createElement("div");
        tag.className = "cell-tag" + (isCurrent ? " cell-tag-current" : "");
        tag.textContent = picks.length===1
          ? `S${picks[0].item.step}`
          : `S${picks.map(p=>p.item.step).join(",")}`;
        cell.appendChild(tag);
      }

      if(isStart){
        const tag = document.createElement("div");
        tag.className = "cell-tag";
        tag.textContent = "STAGE";
        cell.appendChild(tag);
      }

      grid.appendChild(cell);
    }
  }
}

/* ————————————————————————————————————————————————
   INIT
———————————————————————————————————————————————— */
document.getElementById("btn-generate").onclick = generateRoute;
document.getElementById("btn-randomize").onclick = randomizeLocations;

items = clone(baseItems);
generateRoute();
</script>
</body>
</html>
