<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warehouse Pick Path Simulator</title>
<link rel="icon" href="data:,">

<style>
body {
  font-family: system-ui, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
}

h1 {
  margin-top: 0;
}

.container {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 20px;
}

.panel {
  background: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

#pick-list div {
  padding: 6px 4px;
  border-bottom: 1px solid #ddd;
  cursor: pointer;
}

#pick-list div.active {
  background: #d1fad1;
  font-weight: bold;
}

#grid {
  display: grid;
  grid-template-columns: repeat(8, 50px);
  gap: 4px;
  margin-top: 10px;
}

.cell {
  width: 50px;
  height: 50px;
  background: #e0e0e0;
  border-radius: 4px;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.cell.pick {
  background: #b7f7b7;
}

.cell.current {
  background: #6ee76e;
  font-weight: bold;
}

.cell.start {
  background: #bcd4ff;
}

.small {
  position: absolute;
  bottom: 2px;
  right: 4px;
  font-size: 9px;
  opacity: 0.6;
}
</style>
</head>

<body>

<h1>Warehouse Pick Path Simulator</h1>

<div class="container">

  <!-- LEFT PANEL -->
  <div class="panel">
    <button id="gen">Generate Route</button>
    <button id="rand">Randomize</button>

    <h3>Pick List</h3>
    <div id="pick-list"></div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">
    <h3>Warehouse Map</h3>
    <div id="grid"></div>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const GRID_COLS = 8;
  const GRID_ROWS = 5;

  const baseItems = [
    { code:"SKU-1001", aisle:1, bay:2 },
    { code:"SKU-2044", aisle:1, bay:4 },
    { code:"SKU-3110", aisle:2, bay:1 },
    { code:"SKU-4520", aisle:3, bay:3 },
    { code:"SKU-5099", aisle:4, bay:2 },
    { code:"SKU-6123", aisle:5, bay:4 },
    { code:"SKU-7201", aisle:6, bay:3 },
    { code:"SKU-8300", aisle:7, bay:1 },
  ];

  let items = JSON.parse(JSON.stringify(baseItems));
  let route = [];
  let currentStep = 0;

  function locToGrid(a,b){ return {x:a-1, y:b-1}; }

  function manhattan(a,b){
    return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
  }

  function generateRoute() {
    const sorted = [...items].sort((a,b)=>
      a.aisle - b.aisle || a.bay - b.bay
    );

    const staging = {x:0,y:0};
    let last = staging;

    route = sorted.map((item,i)=>{
      const grid = locToGrid(item.aisle,item.bay);
      const dist = manhattan(last,grid);
      last = grid;
      return { ...item, step:i+1, grid, dist };
    });

    currentStep = 0;
    renderList();
    renderGrid();
  }

  function randomize() {
    items = baseItems.map(i => ({
      ...i,
      aisle: Math.min(Math.max(i.aisle + (Math.random()<0.5?-1:1),1),GRID_COLS),
      bay:   Math.min(Math.max(i.bay   + (Math.random()<0.5?-1:1),1),GRID_ROWS)
    }));
    generateRoute();
  }

  function renderList() {
    const list = document.getElementById("pick-list");
    list.innerHTML = "";

    route.forEach((item,i)=>{
      const row = document.createElement("div");
      row.textContent = `${item.code} → A${item.aisle}-B${item.bay}`;
      if(i===currentStep) row.classList.add("active");
      row.onclick = () => {
        currentStep = i;
        renderList();
        renderGrid();
      };
      list.appendChild(row);
    });
  }

  function renderGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    const pickMap = {};
    route.forEach(r => {
      pickMap[`${r.grid.x},${r.grid.y}`] = r;
    });

    for(let y=0;y<GRID_ROWS;y++){
      for(let x=0;x<GRID_COLS;x++){
        const cell = document.createElement("div");
        cell.className = "cell";

        const key = `${x},${y}`;
        const pick = pickMap[key];

        if(x===0 && y===0) cell.classList.add("start");
        if(pick) cell.classList.add("pick");
        if(pick && pick.step-1 === currentStep) cell.classList.add("current");

        cell.innerHTML = `<span class="small">${x+1}-${y+1}</span>`;
        grid.appendChild(cell);
      }
    }
  }

  document.getElementById("gen").onclick = generateRoute;
  document.getElementById("rand").onclick = randomize;

  generateRoute();
});
</script>

</body>
</html>
