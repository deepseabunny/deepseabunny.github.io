<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse Baseline Test</title>
<style>
body { font-family: sans-serif; padding: 20px; }
#grid { display: grid; grid-template-columns: repeat(8, 40px); gap: 4px; margin-top: 20px; }
.cell { width: 40px; height: 40px; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 10px; }
.pick { background: #8f8; }
.current { background: #4c4; }
</style>
</head>
<body>

<h2>Warehouse Baseline Test</h2>
<button id="gen">Generate Route</button>

<div id="list"></div>
<div id="grid"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const baseItems = [
    { code:"SKU-1001", aisle:1, bay:2 },
    { code:"SKU-2044", aisle:1, bay:4 },
    { code:"SKU-3110", aisle:2, bay:1 },
    { code:"SKU-4520", aisle:3, bay:3 },
  ];

  function locToGrid(a,b){ return {x:a-1, y:b-1}; }

  function generateRoute() {
    const sorted = [...baseItems].sort((a,b)=>a.aisle-b.aisle || a.bay-b.bay);
    const list = document.getElementById("list");
    const grid = document.getElementById("grid");

    list.innerHTML = "";
    grid.innerHTML = "";

    sorted.forEach((item,i)=>{
      list.innerHTML += `<div>${item.code} → A${item.aisle}-B${item.bay}</div>`;
    });

    for(let y=0;y<5;y++){
      for(let x=0;x<8;x++){
        const cell = document.createElement("div");
        cell.className = "cell";
        const match = sorted.find(i => i.aisle-1===x && i.bay-1===y);
        if(match) cell.classList.add("pick");
        if(x===0 && y===0) cell.classList.add("current");
        cell.textContent = `${x+1}-${y+1}`;
        grid.appendChild(cell);
      }
    }
  }

  document.getElementById("gen").onclick = generateRoute;
  generateRoute();
});
</script>

</body>
</html>
