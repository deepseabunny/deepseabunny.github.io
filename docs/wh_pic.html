<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse Debug Version</title>
</head>

<body>

<h1>Warehouse Pick Path – Debug Version</h1>

<button id="gen">Generate Route</button>
<button id="rand">Randomize</button>

<h2>Pick List</h2>
<div id="pick-list"></div>

<h2>Grid</h2>
<div id="grid"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const GRID_COLS = 8;
  const GRID_ROWS = 5;

  const baseItems = [
    { code:"SKU-1001", aisle:1, bay:2 },
    { code:"SKU-2044", aisle:1, bay:4 },
    { code:"SKU-3110", aisle:2, bay:1 },
    { code:"SKU-4520", aisle:3, bay:3 },
    { code:"SKU-5099", aisle:4, bay:2 },
    { code:"SKU-6123", aisle:5, bay:4 },
    { code:"SKU-7201", aisle:6, bay:3 },
    { code:"SKU-8300", aisle:7, bay:1 },
  ];

  let items = JSON.parse(JSON.stringify(baseItems));
  let route = [];
  let currentStep = 0;

  function locToGrid(a,b){ return {x:a-1, y:b-1}; }

  function manhattan(a,b){
    return Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
  }

  function generateRoute() {
    const sorted = [...items].sort((a,b)=>
      a.aisle - b.aisle || a.bay - b.bay
    );

    const staging = {x:0,y:0};
    let last = staging;

    route = sorted.map((item,i)=>{
      const grid = locToGrid(item.aisle,item.bay);
      const dist = manhattan(last,grid);
      last = grid;
      return { ...item, step:i+1, grid, dist };
    });

    currentStep = 0;
    renderList();
    renderGrid();
  }

  function randomize() {
    items = baseItems.map(i => ({
      ...i,
      aisle: Math.min(Math.max(i.aisle + (Math.random()<0.5?-1:1),1),GRID_COLS),
      bay:   Math.min(Math.max(i.bay   + (Math.random()<0.5?-1:1),1),GRID_ROWS)
    }));
    generateRoute();
  }

  function renderList() {
    const list = document.getElementById("pick-list");
    list.innerHTML = "";

    route.forEach((item,i)=>{
      const row = document.createElement("div");
      row.textContent = `${item.step}. ${item.code} → A${item.aisle}-B${item.bay}`;
      if(i===currentStep) row.style.fontWeight = "bold";
      row.onclick = () => {
        currentStep = i;
        renderList();
        renderGrid();
      };
      list.appendChild(row);
    });
  }

  function renderGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    const pickMap = {};
    route.forEach(r => {
      pickMap[`${r.grid.x},${r.grid.y}`] = r;
    });

    for(let y=0;y<GRID_ROWS;y++){
      for(let x=0;x<GRID_COLS;x++){
        const div = document.createElement("div");
        div.style.display = "inline-block";
        div.style.width = "60px";
        div.style.height = "40px";
        div.style.border = "1px solid #000";
        div.style.margin = "2px";
        div.style.fontSize = "10px";
        div.style.verticalAlign = "top";
        div.style.padding = "2px";

        const key = `${x},${y}`;
        const pick = pickMap[key];

        if(x===0 && y===0) div.style.background = "#cce0ff";
        if(pick) div.style.background = "#b7f7b7";
        if(pick && pick.step-1 === currentStep) div.style.background = "#6ee76e";

        div.textContent = `A${x+1}-B${y+1}`;
        grid.appendChild(div);
      }
      grid.appendChild(document.createElement("br"));
    }
  }

  document.getElementById("gen").onclick = generateRoute;
  document.getElementById("rand").onclick = randomize;

  generateRoute();
});
</script>

</body>
</html>
