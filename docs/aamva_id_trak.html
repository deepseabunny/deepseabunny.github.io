<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AMMVA / Track Data Explorer — Brite</title>

    <!-- Bootswatch 5 "Brite" theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5/dist/brite/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            padding: 1.5rem;
        }

        textarea {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
        }

        .small-muted {
            font-size: 0.9rem;
            color: var(--bs-gray-600)
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="d-flex align-items-center mb-3">
            <h2 class="me-3">AMMVA / Track Data Explorer</h2>
            <span class="badge bg-info text-dark">Brite</span>
        </div>

        <p class="small-muted">Paste raw track/AMMVA data, then press Parse. This is a best-effort parser — review
            results before use.</p>

        <div class="card mb-3">
            <div class="card-body">
                <label for="rawInput" class="form-label">Raw input</label>
                <textarea id="rawInput" class="form-control mb-2"
                    rows="5">%AZPHOENICS^KIV$DEEPSEA$V^1234 E MAIN ST^?;6360260401379124=491119841122=?+1085205.     D.              1511157BK BRO.         D01111111.                 ?</textarea>

                <div class="d-flex gap-2 flex-wrap">
                    <button id="btnParse" class="btn btn-primary">Parse</button>
                    <button id="btnClear" class="btn btn-outline-secondary">Clear</button>
                    <button id="btnCopyJson" class="btn btn-outline-success">Copy JSON</button>
                    <button id="btnExport" class="btn btn-outline-info">Download JSON</button>
                </div>
            </div>
        </div>

        <div class="row gy-3">
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header">
                        Normalized raw
                    </div>
                    <div class="card-body">
                        <pre id="normalized" class="mono mb-0"> </pre>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        Parsed elements
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-sm table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width:35%">Field</th>
                                    <th>Value</th>
                                </tr>
                            </thead>
                            <tbody id="fieldsTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header">Interpretation / Notes</div>
                    <div class="card-body">
                        <pre id="notes" class="mono mb-0">Parsed output will appear here.</pre>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">JSON output</div>
                    <div class="card-body">
                        <pre id="jsonOut" class="mono mb-0">{ }</pre>
                    </div>
                </div>
            </div>
        </div>

        <footer class="mt-4 small-muted">Built with Bootswatch Brite — single-page</footer>
    </div>

    <script>
        /* Defensive parser similar to earlier version, adapted for this UI */
        function normalize(s) {
            if (!s) return '';
            return s.replace(/[\\r\\n]+/g, ' ').replace(/\\s{2,}/g, ' ').trim();
        }

        function parseRaw(input) {
            const raw = input ?? '';
            const normalized = normalize(raw);
            const result = { raw, normalized, tracks: {}, segments: [] };

            // Track1: %...?
            const t1 = normalized.match(/%([^?]+)\\?/);
            if (t1) result.tracks.track1 = t1[1];

            // Track2: ;...?
            const t2 = normalized.match(/;([^?]+)\\?/);
            if (t2) result.tracks.track2 = t2[1];

            // Track3: +...?
            const t3 = normalized.match(/\\+([^?]+)\\?/);
            if (t3) result.tracks.track3 = t3[1];

            // Split generically on common separators
            const segs = normalized.split(/\\^|\\?|;|\\+|\\.|=|\\$/).map(s => s.trim()).filter(Boolean);
            result.segments = segs;

            // Heuristics for common fields
            if (result.tracks.track1) {
                const parts = result.tracks.track1.split('^').map(p => p.trim()).filter(Boolean);
                result.track1_parts = parts;
                if (parts[0]) result.issuer = parts[0];
                if (parts[1]) result.name_raw = parts[1];
                if (parts[2]) result.address_raw = parts[2];
            }

            if (result.tracks.track2) {
                const m = result.tracks.track2.match(/^([0-9]{10,19})=([0-9]{2,})/);
                if (m) result.card_like = { primary: m[1], secondary: m[2] };
            }

            // Generic scanning for numbers and address-like entries
            segs.forEach(s => {
                if (/^[0-9]{12,19}$/.test(s)) {
                    result.license_number = result.license_number || s;
                } else if (/\\d/.test(s) && /[A-Za-z]/.test(s) && s.length < 80) {
                    // likely address
                    result.address = result.address || s;
                } else if (/[A-Z]{2,}/.test(s) && s.length < 40 && /\\s/.test(s) && !/\\d/.test(s)) {
                    result.name = result.name || s;
                }
            });

            return result;
        }

        function renderParsed(parsed) {
            document.getElementById('normalized').textContent = parsed.normalized || '';
            const tbody = document.getElementById('fieldsTable');
            tbody.innerHTML = '';

            const rows = [
                ['Issuer', parsed.issuer || '—'],
                ['Name (raw)', parsed.name_raw || parsed.name || '—'],
                ['Address (raw)', parsed.address_raw || parsed.address || '—'],
                ['Track1', parsed.tracks.track1 || '—'],
                ['Track2', parsed.tracks.track2 || '—'],
                ['Track3', parsed.tracks.track3 || '—'],
                ['Detected number', parsed.license_number || (parsed.card_like && parsed.card_like.primary) || '—'],
                ['Other numeric', parsed.card_like ? parsed.card_like.secondary : '—'],
                ['Segments count', parsed.segments.length.toString()]
            ];

            rows.forEach(([k, v]) => {
                const tr = document.createElement('tr');
                const tdK = document.createElement('td');
                const tdV = document.createElement('td');
                tdK.textContent = k;
                tdV.textContent = v;
                tr.appendChild(tdK); tr.appendChild(tdV);
                tbody.appendChild(tr);
            });

            document.getElementById('notes').textContent = [
                'This is a best-effort parse. Review values before use.',
                '',
                'Segments (in order):',
                parsed.segments.join(' | ')
            ].join('\\n');

            document.getElementById('jsonOut').textContent = JSON.stringify(parsed, null, 2);
        }

        /* UI actions */
        document.getElementById('btnParse').addEventListener('click', () => {
            const input = document.getElementById('rawInput').value;
            const parsed = parseRaw(input);
            renderParsed(parsed);
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            document.getElementById('rawInput').value = '';
            document.getElementById('normalized').textContent = '';
            document.getElementById('fieldsTable').innerHTML = '';
            document.getElementById('notes').textContent = '';
            document.getElementById('jsonOut').textContent = '{}';
        });

        document.getElementById('btnCopyJson').addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(document.getElementById('jsonOut').textContent || '');
                alert('JSON copied to clipboard');
            } catch (e) {
                alert('Copy failed');
            }
        });

        document.getElementById('btnExport').addEventListener('click', () => {
            const data = document.getElementById('jsonOut').textContent || '{}';
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'ammva-parsed.json';
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
        });

        /* Auto-parse on load */
        window.addEventListener('load', () => document.getElementById('btnParse').click());
    </script>
</body>

</html>
